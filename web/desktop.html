<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIFI 直连 · 文件快传</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="brand">
      <div class="logo">⇄</div>
      WIFI 直连<small>文件快传</small>
    </div>
    <div class="spacer"></div>
    <div class="status-pill">
      <i class="dot" id="phoneDot"></i>
      <span id="phoneText">等待手机连接</span>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="qr-card">
        <div class="qr-frame"><img id="qr" alt="二维码"></div>
        <div class="qr-hint">用手机相机或浏览器扫码<br>手机无需安装任何 App</div>
        <div class="addr" id="addr" title="点击复制">
          <span class="mono" id="addrText">正在启动…</span>
          <b style="color:var(--accent)">复制</b>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">连接信息</div>
        <div class="kv"><span>本机</span><b id="hostname">—</b></div>
        <div class="kv"><span>局域网 IP</span><b><span id="ipText" class="mono">—</span><i id="ipNic" class="nic-tag"></i></b></div>
        <div class="kv kv-dir">
          <span>接收目录</span>
          <b id="dlDir" title="">—</b>
          <button class="mini-btn" id="pickDir" title="更改手机文件的接收目录">更改</button>
        </div>
        <div class="dir-warn" id="dlWarn" hidden></div>
      </div>

      <div class="panel">
        <div class="panel-title">小提示</div>
        <div class="muted" style="font-size:11.5px;line-height:1.7">
          · 手机和电脑要连同一 Wi-Fi<br>
          · 「选择文件」零拷贝直发<br>
          · 「截图」框选后发到手机<br>
          · 按 PrintScreen 也能唤起截图
        </div>
      </div>
    </aside>

    <section class="content">
      <div class="tabs">
        <button class="tab active" data-view="out">发给手机 <i class="count" id="cntOut">0</i></button>
        <button class="tab" data-view="in">来自手机 <i class="count" id="cntIn">0</i></button>
        <button class="tab" data-view="text">文字互传 <i class="count" id="cntText">0</i></button>
      </div>

      <!-- 发给手机 -->
      <div class="view" id="view-out">
        <div class="dropzone" id="drop">
          <h3>把文件放到这里，手机上立刻就能下载</h3>
          <p>不复制、不压缩、不等待，原文件直接走局域网</p>
          <div class="drop-actions">
            <button class="btn btn-primary" id="pickBtn">选择文件</button>
            <button class="btn" id="shotBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-1.6h6.2L15.8 6h1.7A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-12A2.5 2.5 0 0 1 3 17.5z"/><circle cx="11.5" cy="13" r="3.4"/></svg>截图</button>
          </div>
        </div>
        <div class="list" id="listOut"></div>
      </div>

      <!-- 来自手机 -->
      <div class="view" id="view-in" hidden>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex:none">
          <button class="btn btn-sm" id="openDir">打开接收目录</button>
          <button class="btn btn-sm btn-ghost" id="clearIn">清空记录</button>
        </div>
        <div id="uploadArea"></div>
        <div class="list" id="listIn"></div>
      </div>

      <!-- 文字 -->
      <div class="view" id="view-text" hidden>
        <div class="text-wrap">
          <div class="text-input">
            <textarea id="textBox" placeholder="在这里输入或粘贴文字，发送到手机剪贴板…（Ctrl+Enter 发送）"></textarea>
            <button class="btn btn-primary send-text" id="sendText">发送</button>
          </div>
          <div class="text-list" id="textList"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toast-host" id="toasts"></div>
<script src="/static/desktop.js"></script>
</body>
</html>
